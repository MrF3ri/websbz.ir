services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    env_file:
      - .env.docker
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-websbz}
      DB_USERNAME: ${DB_USERNAME:-websbz}
      DB_PASSWORD: ${DB_PASSWORD:-websbz-local-only}
      VITE_DEV_SERVER_HOST: 0.0.0.0
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - websbz

  web:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - websbz

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-websbz}
      POSTGRES_USER: ${DB_USERNAME:-websbz}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-websbz-local-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-websbz} -d ${DB_DATABASE:-websbz}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - websbz

  vite:
    build:
      context: .
      dockerfile: Dockerfile
      target: vite
    working_dir: /var/www/html
    env_file:
      - .env.docker
    command: sh -lc "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
      - node_modules:/var/www/html/node_modules
    depends_on:
      - app
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-websbz}
      DB_USERNAME: ${DB_USERNAME:-websbz}
      DB_PASSWORD: ${DB_PASSWORD:-websbz-local-only}
      VITE_DEV_SERVER_HOST: 0.0.0.0
    networks:
      - websbz

  # Optional worker; enable when queued workloads are introduced:
  # worker:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #     target: app
  #   env_file:
  #     - .env.docker
  #   environment:
  #     DB_CONNECTION: pgsql
  #     DB_HOST: postgres
  #     DB_PORT: 5432
  #     DB_DATABASE: ${DB_DATABASE:-websbz}
  #     DB_USERNAME: ${DB_USERNAME:-websbz}
  #     DB_PASSWORD: ${DB_PASSWORD:-websbz-local-only}
  #   command: php artisan queue:work --tries=3
  #   volumes:
  #     - .:/var/www/html
  #     - vendor:/var/www/html/vendor
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   networks:
  #     - websbz

volumes:
  postgres_data:
  vendor:
  node_modules:

networks:
  websbz:
    driver: bridge
