name: Resolve Phase 10 S3 adapter

on:
  push:
    branches:
      - feat/phase-10-media-completion
    paths:
      - .github/workflows/resolve-phase-10-s3-adapter.yml

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Phase 10 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2

      - name: Resolve and lock the S3 filesystem adapter
        run: composer require league/flysystem-aws-s3-v3:^3.0 --no-interaction --no-progress --no-scripts

      - name: Commit the resolved dependency lock
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.json composer.lock
          if git diff --cached --quiet; then
            echo "S3 adapter is already locked."
            exit 0
          fi
          git commit -m "build(media): add S3 Flysystem adapter"
          git push origin "HEAD:${BRANCH_NAME}"
