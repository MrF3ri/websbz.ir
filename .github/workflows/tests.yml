name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  sqlite:
    name: Fast suite (SQLite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check

      - name: Build Docker application image
        run: docker build --target app --tag websbz-baseline:ci .

  postgresql:
    name: Full suite (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: websbz_test
          POSTGRES_USER: websbz
          POSTGRES_PASSWORD: websbz_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U websbz -d websbz_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: websbz_test
      DB_USERNAME: websbz
      DB_PASSWORD: websbz_test_password
      DB_URL: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # Run the same application setup used by the SQLite job. Besides dependencies,
      # this generates Wayfinder declarations required by vue-tsc and builds the assets.
      # The PostgreSQL connection is supplied by the job-level environment above.
      - name: Setup Application
        run: composer setup

      - name: Run frontend type checks
        run: npm run check

      - name: Run Pint
        run: vendor/bin/pint --parallel --test

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G

      - name: Verify active database driver for PHPUnit
        run: php artisan db:show

      - name: Run full PHPUnit suite against PostgreSQL
        run: php artisan test

      - name: Build frontend assets
        run: npm run build
