name: websbz-production

services:
  app:
    image: ${APP_IMAGE:-websbz:production}
    build:
      context: .
      dockerfile: Dockerfile.production
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      SESSION_SECURE_COOKIE: "true"
      FILESYSTEM_DISK: local
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - frontend
      - backend

  assets:
    image: ${APP_IMAGE:-websbz:production}
    user: "0:0"
    command:
      - sh
      - -lc
      - find /public -mindepth 1 -maxdepth 1 -exec rm -rf {} + && cp -a /var/www/html/public/. /public/
    volumes:
      - public_assets:/public
    restart: "no"

  web:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    volumes:
      - public_assets:/var/www/html/public:ro
      - ./docker/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_started
      assets:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - frontend

  worker:
    image: ${APP_IMAGE:-websbz:production}
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: local
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=90"]
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started
    restart: unless-stopped
    networks:
      - backend

  scheduler:
    image: ${APP_IMAGE:-websbz:production}
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: local
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started
    restart: unless-stopped
    networks:
      - backend

  postgres:
    image: postgres:17-alpine
    env_file:
      - .env.production
    environment:
      POSTGRES_DB: ${DB_DATABASE:?Set DB_DATABASE in .env.production}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in .env.production}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"${POSTGRES_USER}\" -d \"${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - backend

volumes:
  postgres_data:
  storage_data:
  public_assets:

networks:
  frontend:
    internal: true
  backend:
    internal: true
